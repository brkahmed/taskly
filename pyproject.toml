[project]
name = "taskly"
version = "1.3.0"
description = "A CLI application to manage tasks."
authors = [{ name = "Ahmed", email = "braika7med@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["tabulate>=0.9.0"]

[project.urls]
Homepage = "https://github.com/brkahmed/taskly"

[project.scripts]
taskly = "taskly:main"

[tool.uv]
package = true

[tool.setuptools]
py-modules = ["taskly"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "I",  # isort
    "B",  # bugbear
    "UP", # pyupgrade
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.3.2",
    "ruff>=0.16.4",
    "ty>=0.0.73",
]
