[project]
name = "taskly"
version = "1.2.0"
description = "A CLI application to manage tasks."
authors = [{ name = "Ahmed", email = "braika7med@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["tabulate>=0.9.0"]

[project.urls]
Homepage = "https://github.com/brkahmed/taskly"

[project.scripts]
taskly = "taskly:main"

[tool.uv]
package = true

[tool.setuptools]
py-modules = ["taskly"]

[tool.ruff]
line-length = 120
select = ["I"]
fix = true

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest>=8.3.2"]
